<!DOCTYPE html>
<html>
<head>
    <title>{{ post.title }} | 431103021d.ru</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
            background: #0a0a0a;
            color: #00ff00;
        }
        h1 {
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
        }
        .post-date {
            color: #008800;
            font-size: 14px;
            margin: 5px 0 30px 0;
        }
        .post-content {
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }
        
        /* Заголовки */
        .post-content h1 { 
            color: #00ff00; 
            border-bottom: 2px solid #00ff00; 
            padding-bottom: 5px;
        }
        .post-content h2 { color: #00ff00; }
        .post-content h3 { color: #00aa00; }
        
        /* Код */
        .post-content code {
            background: #1a1a1a;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            border: 1px solid #00ff00;
        }
        .post-content pre {
            background: #1a1a1a;
            padding: 15px;
            border: 1px solid #00ff00;
            overflow-x: auto;
            border-radius: 5px;
        }
        .post-content pre code {
            background: none;
            border: none;
            padding: 0;
        }
        
        /* Цитаты */
        .post-content blockquote {
            border-left: 3px solid #00ff00;
            margin: 0;
            padding: 0 20px;
            color: #008800;
            font-style: italic;
        }
        
        /* Списки */
        .post-content ul, .post-content ol {
            padding-left: 20px;
        }
        
        /* Ссылки */
        .post-content a {
            color: #00ff00;
            text-decoration: underline;
        }
        .post-content a:hover {
            text-decoration: none;
        }
        
        /* Таблицы */
        .post-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
        }
        .post-content th, .post-content td {
            border: 1px solid #00ff00;
            padding: 8px;
            text-align: left;
        }
        .post-content th {
            background: #1a1a1a;
        }
        
        .back-link {
            margin-top: 40px;
            display: inline-block;
            color: #00ff00;
            text-decoration: none;
            border: 1px solid #00ff00;
            padding: 10px 20px;
        }
        .back-link:hover {
            background: #00ff00;
            color: #0a0a0a;
        }
    </style>
</head>
<body>
    <h1>{{ post.title }}</h1>
    <div class="post-date">{{ post.created_at.strftime('%d %B %Y') }}</div>
    
    <div class="post-content">
        {{ convert_markdown(post.content)|safe }}
    </div>
    
    <a href="/" class="back-link">← На главную</a>
</body>
</html>
