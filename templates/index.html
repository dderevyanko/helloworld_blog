<!DOCTYPE html>
<html>
<head>
    <title>Блог 431103021d.ru</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
            background: #0a0a0a;
            color: #00ff00;
        }
        h1 {
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
        }
        .post {
            margin: 30px 0;
            padding: 20px;
            border: 1px dashed #00ff00;
        }
        .post-title {
            color: #00ff00;
            font-size: 24px;
            font-weight: bold;
        }
        .post-date {
            color: #008800;
            font-size: 14px;
            margin: 5px 0;
        }
        .post-content {
            margin-top: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>431103021d.ru</h1>
    <p>Блог о сетях, серверах и магии коммутаторов</p>
    
    {% for post in posts %}
    <div class="post">
        <div class="post-title">{{ post.title }}</div>
        <div class="post-date">{{ post.created_at.strftime('%d %B %Y') }}</div>
        <div class="post-content">{{ post.content }}</div>
    </div>
    {% else %}
    <p>Пока нет постов. Скоро появятся!</p>
    {% endfor %}
</body>
</html>
