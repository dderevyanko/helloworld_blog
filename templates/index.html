<!DOCTYPE html>
<html>
<head>
    <title>Блог 431103021d.ru</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
            background: #0a0a0a;
            color: #00ff00;
        }
        h1 {
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-link {
            color: #00ff00;
            text-decoration: none;
            border: 1px solid #00ff00;
            padding: 5px 15px;
        }
        .admin-link:hover {
            background: #00ff00;
            color: #0a0a0a;
        }
        .post {
            margin: 30px 0;
            padding: 20px;
            border: 1px dashed #00ff00;
        }
        .post-title {
            color: #00ff00;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }
        .post-title:hover {
            text-decoration: underline;
        }
        .post-date {
            color: #008800;
            font-size: 14px;
            margin: 5px 0;
        }
        .post-content {
            margin-top: 15px;
            line-height: 1.6;
        }
        .read-more {
            display: inline-block;
            margin-top: 15px;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 5px 15px;
            text-decoration: none;
        }
        .read-more:hover {
            background: #00ff00;
            color: #0a0a0a;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>431103021d.ru</h1>
        <a href="/login" class="admin-link">Админка</a>
    </div>
    <p>Блог о сетях, серверах и магии коммутаторов</p>
    
    {% for post in posts %}
    <div class="post">
        <a href="/post/{{ post.id }}" class="post-title">{{ post.title }}</a>
        <div class="post-date">{{ post.created_at.strftime('%d %B %Y') }}</div>
        <div class="post-content">{{ post.preview|safe }}</div>
        <a href="/post/{{ post.id }}" class="read-more">Читать далее →</a>
    </div>
    {% else %}
    <p>Пока нет постов. Скоро появятся!</p>
    {% endfor %}
</body>
</html>
